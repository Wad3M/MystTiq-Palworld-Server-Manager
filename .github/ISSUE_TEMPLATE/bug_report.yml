# MystTiq v0.9.8.0: file reviewed for this release (2026-09-29).
name: Bug report
description: Report a reproducible application problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload passwords, tokens, private saves, public IP addresses, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.9.8.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and desktop environment
      placeholder: Windows 11 x64, or Ubuntu 24.04 x64 with XFCE
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - Local MystTiq service
        - Remote MystTiq service
        - Not connected / unsure
  - type: input
    id: appearance
    attributes:
      label: Language and appearance mode (for display issues)
      placeholder: Japanese, Light, Comfortable density
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error text
    validations:
      required: true
