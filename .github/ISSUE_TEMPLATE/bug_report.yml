name: Bug report
description: Report a reproducible application problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload passwords, tokens, private saves, public IP addresses, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.12
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error text
    validations:
      required: true
