name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/PalworldManager/PalworldManager.csproj
      - name: Build
        run: dotnet build src/PalworldManager/PalworldManager.csproj -c Release -r win-x64 --self-contained true --no-restore
