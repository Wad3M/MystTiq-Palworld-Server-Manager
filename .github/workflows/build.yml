# MystTiq v1.0.4.0: file reviewed for this release (2026-10-05).
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the headless service and the desktop (Windows)
        run: |
          dotnet build src/MystTiq.HeadlessHost/MystTiq.HeadlessHost.csproj -c Release
          dotnet build src/MystTiq.Desktop/MystTiq.Desktop.csproj -c Release

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the headless service and the desktop (Linux)
        run: |
          dotnet build src/MystTiq.HeadlessHost/MystTiq.HeadlessHost.csproj -c Release
          dotnet build src/MystTiq.Desktop/MystTiq.Desktop.csproj -c Release
