name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Package portable build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $projectVersion = ./scripts/Get-ProjectVersion.ps1
          if ($version -ne $projectVersion) { throw "Tag version $version does not match project version $projectVersion." }
          ./scripts/Package-Portable.ps1 -Version $version
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
